<div class="flex h-screen bg-gray-50">
  <!-- Sidebar -->
  <aside 
    [class]="sidebarOpen() ? 'w-64' : 'w-20'"
    class="bg-gradient-to-b from-green-600 to-green-800 text-white transition-all duration-300 flex flex-col shadow-2xl">
    
    <!-- Logo -->
    <div class="p-6 flex items-center justify-between border-b border-white/10">
      @if (sidebarOpen()) {
        <h1 class="text-2xl font-bold">Ventas</h1>
      }
      <button 
        (click)="toggleSidebar()"
        class="p-2 hover:bg-white/10 rounded-lg transition-colors">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2">
      @for (item of menuItems; track item.route) {
        <a 
          [routerLink]="item.route"
          routerLinkActive="bg-white/20 shadow-lg"
          [routerLinkActiveOptions]="{exact: item.route === '/usuario'}"
          class="flex items-center gap-4 px-4 py-3 rounded-xl hover:bg-white/10 transition-all group">
          <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            @switch (item.icon) {
              @case ('dashboard') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
              }
              @case ('package') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
              }
              @case ('warehouse') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path>
              }
              @case ('user-group') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
              }
              @case ('receipt') {
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
              }
            }
          </svg>
          @if (sidebarOpen()) {
            <span class="font-medium">{{ item.label }}</span>
          }
        </a>
      }
    </nav>

    <!-- User Profile -->
    <div class="p-4 border-t border-white/10">
      <div class="flex items-center gap-3 px-4 py-3 bg-white/10 rounded-xl">
        <div class="w-10 h-10 bg-gradient-to-br from-yellow-400 to-orange-600 rounded-full flex items-center justify-center flex-shrink-0">
          <span class="text-sm font-bold">{{ (authService.currentUser()?.email || 'U').charAt(0).toUpperCase() }}</span>
        </div>
        @if (sidebarOpen()) {
          <div class="flex-1 min-w-0">
            <p class="text-sm font-medium truncate">{{ authService.currentUser()?.email }}</p>
            <p class="text-xs text-white/70">Encargado de Ventas</p>
          </div>
        }
      </div>
      <button 
        (click)="logout()"
        class="w-full mt-2 flex items-center justify-center gap-2 px-4 py-2 bg-red-500/20 hover:bg-red-500/30 rounded-xl transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        @if (sidebarOpen()) {
          <span class="text-sm">Cerrar Sesión</span>
        }
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto">
    <router-outlet></router-outlet>
  </main>
</div>
